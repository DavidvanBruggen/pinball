# DNA backbone -- loaded via build_pinball(cfg_path=..., num_tracks=<dim>).
# Architecture keys only: the host harness owns the loop, data, optimizer and batching.
#
#
# THREE-KERNEL LINEAR ARM. Six coarse levels on the ADDITIVE path: a mixed local window,
# a windowed coarse lane, and one all-to-all GLOBAL TIER. Replaces the flexhier arm's
# single fused flex_attention softmax over "band OR global block".
#
# Why, against flexhier at 32768:
#
#   The block is read by EVERY query, so it costs n_block * N. Holding the same levels
#   needs n_block proportional to N, which is quadratic; a fixed budget stays linear but
#   strands levels as N grows (at 131072 the 896 budget affords only L5+L6, and L4 drops
#   to seeing ONE of its own 1024 nodes). The tier reads only itself, so it costs
#   n_tier^2 -- 120x cheaper than the block for an identical global set, at every length.
#
#   The block also gives full within-level reach only to the levels it CONTAINS. Levels
#   below the cutoff see their own level only through the +-156 mixed band, which at L3's
#   stride of 32 is +-4 nodes. The lane is denominated in bank slots instead, so a single
#   radius buys every coarse level a large own-level neighbourhood, constant in N.
#
# Own-level nodes visible, and step time, measured at 32768 (compiled, Blackwell,
# pinball-bw, flex verified to actually run -- flexfail=0 on every arm):
#
#   arm                                    step        L1     L2     L3   global nodes
#   flexhier (flex_union + 896 block)     460.8 ms     31     15      7   336 (block)
#   THIS ARM (budget 400, window 900)     455.0 ms    982    491    245   336 (tier)
#   same, window 469                      450.2 ms    512    256    128   336 (tier)
#   all-to-all lane, no tier              485.5 ms    ALL    ALL    ALL   -- 56.3M pairs
#
# Same global cardinality, ~33x the lateral reach, no step-time cost. The deltas are near
# the ~1% run-to-run noise, and these arms ran later and hotter than the flexhier one, so
# they are conservative. The all-to-all lane is the windowed arm's shape and does not
# survive the move to 32768 -- bench_hierarchy_plan flags it as the N^2 term.
#
# End-to-end reach is 4 layers here against 3-4 for flexhier (attention-only lower bound;
# hier_upward_refresh / hier_downward_refresh give a second, un-modelled path). Against 15
# layers that is ample, and unlike the block it does not degrade with N: flexhier needs 9
# layers at 131072 and does not reach at all by 524288.
#
# SIZING. local_pack_top_global_budget takes whole levels top-down while they fit; 400
# buys L4+L5+L6 = 336 nodes at 32768, matching what the block held. "sqrt" resolves to
# floor(sqrt(N)) -- the point past which the tier's own n^2 stops being linear -- but at
# 32768 that yields only 80 nodes and strands L4, so the explicit budget is used here.
# local_pack_coarse_window accepts "auto", the radius that guarantees every coarse row a
# tier node (53 for a 336-node tier). Prefer an explicit value well above it: auto is the
# narrowest window that works, and lateral reach is the reason this arm exists.
#
# Check any edit with:  python bench_hierarchy_plan.py --config <this file> --scan 4096 1048576
block_size: 32768 #4096
model_type: pinball
tokenizer_name: gpt2            # unused in features mode; build_pinball stubs it

# Extra levels are comp 8 @ overlap 0.5 -> stride 4. Do NOT use comp 2 here:
# stride = max(1, int(comp*(1-overlap))), so comp 2 @ 0.5 gives int(1.0) = 1 and the level
# does not compress at all.
compression_ratios: [16, 4, 4, 8, 8, 8]
overlap_ratios: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

hidden_dim: 1024
num_heads: 16
num_refinement_layers: 15         # LAYER-matched to transformer_dna_bidi, which is also 15.
                                  # Measured: per-layer parameters are the SAME in both models
                                  # (12.87M vs 12.85M -- identical SwiGLU FFN and QKV+out), so
                                  # equal depth means equal per-layer capacity and the ONLY
                                  # difference left is the hierarchy itself. That is the clean
                                  # control; param-matching instead (14 vs 15) would make the
                                  # transformer 25% deeper and confound depth with mechanism.
                                  #
                                  # Residual gap to declare: pinball carries a depth-INDEPENDENT
                                  # 25.59M of scaffolding vs the transformer's 4.33M (its learned
                                  # position table, live even though RoPE is on). At 15 layers
                                  # that is 218.61M vs 197.13M, or 212.04M vs 197.13M (+7.6%)
                                  # counting only parameters that receive gradient -- 6.57M of
                                  # pinball's total is allocated unconditionally and never runs
                                  # here (cond_film, time_embed_mlp, hier_recon_head,
                                  # highest_to_token_projection).
                                  #
                                  # NB full/windowed sit at 12, so this arm is layer-matched to
                                  # the transformer but NOT to the other pinball arms.
num_layers: [0, 0, 0, 0, 0, 0, 0]   # length = level count (L0 + 6 coarse)
internal_cycles: [0, 0, 0, 0]
refinement_style: unified
unified_refinement_cycles: 1
l0_cycles: 0
iterative_refinement_cycles: 0
local_connectivity_window_size: 0
dropout: 0.1
# Per-level DropNode. Index i = level i; L0 is pinned to 0.0 whatever this says. Level sizes
# at 4096 are L1 512, L2 256, L3 128, L4 32, L5 8, L6 2 -- dropping 10% of a 2-row level is a
# 50%-of-the-level event, so the top levels get none.
hier_node_dropout: 0.0
hier_node_dropout_per_level: [0.0, 0.1, 0.1, 0.05, 0.0, 0.0, 0.0]
norm_type: layernorm
attn_backend: flash             # alias -> l0_local_backend
qkv_sharing: shared
use_gradient_checkpointing: false

# Bidirectional: coverage reads the whole window, nothing to leak.
ar_graph_causal: false
ar_hier_edge_mode: none
drop_static_cross_level_edges: true
local_pack_bidirectional: true
hier_downward_bidi_parent: true

# 1D positions, set explicitly rather than left to the spatial_dims fallback.
spatial_curve: none
local_pack_rope_axial: false

# refine_cond_mode is deliberately absent: the harness calls the model bare, with no
# conditioning vector for per-layer FiLM to read.

upper_init: pooled
upper_seed_gate_init: 1.0
hier_upward_refresh: true
hier_upward_refresh_every: 1
hier_upward_refresh_gate_init: 0.1
hier_downward_refresh: true
hier_downward_refresh_every: 1
hier_downward_refresh_gate_init: 0.1
hier_refresh_compile: true
hier_layer_compile: true

# === Stability / reach knobs ==========================================================
# All default off and are exact no-ops when off. Only hier_pool_gate is enabled here.

# Per-child sigmoid relevance gate on hierarchy pooling, shared by the pooled upper seed and
# the upward refresh: pooled = mean_j(sigmoid(<u_l, x_j> + b_l) * x_j). Normalising by the
# window count rather than the gate sum lets an all-low-gate window yield a small vector
# instead of a rescaled average. ~0.1% compute, +6,150 params. Compiled: +1.7% @4096 B=2.
hier_pool_gate: false
# Trade-off, not a formality: ~10 reproduces the plain mean but saturates the gate
# (sigmoid'(10)=4.5e-5) so it never trains. Use ~10 only to warm-start a checkpoint.
hier_pool_gate_bias_init: 2.0

# Pool L0 into every coarse level directly instead of chaining level <- level-1. The chain
# multiplies per-level factors and repeats every layer (6 levels x 15 layers vs 3 x 12 for
# the windowed arm), and takes six layers for L0 to reach the top. Compiled: +6.2% with the
# gate; pair with hier_upward_refresh_every: 2 to recover it.
hier_upward_refresh_direct: false
hier_upper_seed_direct: false      # same for the one-shot seed (runs once, not per layer)

# Per-level same-level radius, in that level's own node units, filling the resolution gap
# between the mixed-slot band and the global block. Radius 64 reaches +-65/131/262 kb at
# L1/L2/L3 (128 bp/token). Causality verified against a leaking control; lse reproduces the
# single-softmax union to 1.6e-06 relative. Cost at N=32768 B=1, [0,64,64,64,0,0,0],
# compiled (eager understates the relative cost -- the baseline halves, the ring does not):
#   none 470.1ms 33.3GiB | additive +20.1% 39.0GiB | lse +34.9% 46.2GiB | union +82.7% 33.1GiB
# The two-call modes (additive, lse) buy time with memory and add one graph break; union
# gathers nothing extra but costs 4x the time.
local_pack_ring_windows: null
local_pack_ring_merge: additive    # additive | lse | union -- inert while rings are null

# Per-level DropNode. The scalar above drops 10% of every coarse level; at 4096, L5 has 8
# rows and L6 has 2, where that is a large fraction of the level. Index i = level i.
# hier_node_dropout_per_level: [0.0, 0.1, 0.1, 0.05, 0.0, 0.0, 0.0]
# ======================================================================================

# Stability normalizations (both default ON; set false only to reproduce a checkpoint
# trained before they existed). final_norm_fast_path re-applies the terminal norm on exit
# from the refinement loop, which the fast path had lost -- without it nothing renormalizes
# the residual stream before output_projection. qk_norm normalizes q/k over head_dim before
# the dot product, bounding the attention logits; it matters most here because one softmax
# spans all four levels at once. Cost of both together is within noise (~1-2%).
final_norm_fast_path: true
qk_norm: true
qk_norm_type: rms               # rms (nn.RMSNorm) | layer (nn.LayerNorm)

# Required: these populate local_attn_config, which gates the packed cross-level path.
# Without them every local_pack_* key below is silently inert.
local_attn_windows: [128, 128, 128, 128, 128, 128, 128]
l0_local_window: 128

local_pack_cross_level: true
local_pack_query_levels: [0, 1, 2, 3, 4, 5, 6]   # MUST cover every level
local_pack_level_bias: true
local_pack_coarse_lane: true
# Lane radius in COARSE bank slots -- this is the knob that buys within-level lateral
# reach, and unlike the band it is denominated in the bank rather than the mixed stream.
# Own-level nodes seen at 32768: 900 -> 982/491/245 at L1/L2/L3, 469 -> 512/256/128,
# 64 -> 70/35/17. Constant in N, because each level's share of the bank is. Must be a
# scalar or "auto": the per-level list form takes a different spec branch (one flash call
# per level, measured 1.8x slower at 4096 -- launch-bound, not FLOP-bound).
local_pack_coarse_window: 900
# The band, the lane and the tier are three separate flash calls summed. Additive is not
# one softmax over the union: a coarse row inside BOTH the band and the lane is attended
# twice (~57 of ~900 lane keys at 32768). That is inherent to the path, not a defect, and
# the trained A/B on 2026-07-14 favoured additive over flex_union late-run anyway.
local_pack_flex_union: false
local_pack_global_block: 0      # the tier replaces it: n_tier^2 instead of n_block*N
local_pack_l0_coarse_rank_window: 0     # OFF: that clause is the quadratic one (its key
                                        # set is a fixed fraction of N).
local_pack_lane_merge: false    # causal-only; inert in a bidi run

# GLOBAL TIER. Whole levels top-down while they fit the budget, attending all-to-all over
# themselves. 400 buys L4+L5+L6 = 336 nodes at 32768, the same global set the 896-row block
# held, for n^2 instead of n*N.
#   budget 0      topmost level alone: 16 nodes at 32768, and only 2 at 4096.
#   budget sqrt   floor(sqrt(N)); at 32768 that is 80 nodes and strands L4, hence 400 here.
local_pack_top_global: true
local_pack_top_global_budget: 400     # 0 | <row budget> | sqrt
# local_pack_coarse_window also accepts "auto": the radius that puts a tier node inside EVERY
# coarse row's window, so the ascent to the tier is one hop. It is sized from the true
# worst-case distance to the nearest tier row, not from mean spacing -- tier levels carry
# large ar_time offsets, so the first tier node sits ~224 bank rows in at 16384 and any
# spacing-derived radius leaves the head of the sequence unable to ascend (measured: 0 tier
# nodes in window for the earliest rows). Under this rule reach measures flat at 5 hops from
# 4k to 512k, where the fixed-budget block above degrades (3 hops at 32k, 9 at 131k, none
# within 10 at 524k) because it holds fewer levels as N grows.
#
# local_pack_coarse_window_tier_nodes (k) widens the window to span about k tier nodes. It
# only binds above the geometric floor: at 16384 with budget sqrt the floor is 268, so k=2..4
# all resolve to 268 and k=10 gives 465, which costs +0.7% -- inside the ~1% run-to-run noise
# on this harness. A wider window is what gives the level just below the tier (L4, span 256)
# a usable receptive field, so raising k is cheap insurance.
#
# Measured at 16384 (compiled, 4090, vs a no-tier windowed lane), both sized to guarantee the
# ascent: tier=40 (budget sqrt) +1.9% at W=268; tier=8 (budget 0) +4.8% at W=1088. A sparse
# tier is the expensive option -- it needs a far wider lane to stay reachable.
#
# HEAD-TO-HEAD vs THIS ARM at 32768 (compiled, Blackwell, pinball-bw, flexfail=0 throughout):
#   flexhier as-is (flex_union + 896 block)   460.8 ms   own-level L1/L2/L3 =  31/ 15/  7
#   budget 400 + coarse_window 900            455.0 ms   own-level         = 982/491/245
#   budget 400 + coarse_window 469            450.2 ms   own-level         = 512/256/128
#   all-to-all lane, no tier                  485.5 ms   own-level = ALL (56.3M pairs, N^2)
# Same 336 global nodes either way; the tier costs n^2 where the block costs n*N (120x apart
# at every length), so the block is the term that cannot scale. Deltas are near the ~1%
# run-to-run noise, and the tier arms ran later/hotter, so they are conservative.

# Source gating is on in every arm so the arms differ by mechanism, not parameter count.
# sigmoid(hqd_source_gate_logit) reads out how much the model weights HQD; dump it from a
# checkpoint with tools_gate_dump.py.
attention_source_gating_enable: false
attention_source_gate_init_graph: 1.0
attention_source_gate_init_local: 1.0   # 1.0, not the 0.5 default, which halves the main
                                        # attention path
attention_source_gate_init_hqd: 0.05    # small but trainable: a sigmoid near 0 damps its
                                        # own gradient and starves the HQD subtree
attention_source_gate_debug: true       # 0-dim tensors, one sync per logging interval

xq_nominate_enable: false
pinball_multirate_enable: false
use_aux_loss: false
hier_aux_mode: mean_mse         # jepa_mlp would allocate 16.8M predictor params, dead unless aux is on
token_unet_enable: false
use_edge_embedding: false
learn_edge_from_attention: false
lateral_edge_trace_enable: false

# === DEEP FLEXHIER ARM: windowed L0 + global block, one softmax =======================
# Matches the windowed control's L0 window so the arms differ by hierarchy, not by L0 reach.
# +-W in PACKED slots, NOT tokens: packed length is 5034 at 4096, so 156 slots is ~+-127 L0
# tokens. Do not copy 1248 across from the latent config -- there it happened to equal the
# whole packed length (1024 grid + 224 coarse) and so meant "global"; here it is just a wide
# band that costs 3098 pairs/token instead of 670 and reaches no further.
local_pack_window: 156
use_hqd: false
