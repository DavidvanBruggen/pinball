# Pinball with Hierarchical Query Descent (HQD) enabled — coarse-to-fine sparse attention
# that descends from top-level summaries down to L0 tokens via per-level top-k selection.

model_type: pinball
modality: text
tokenizer_name: gpt2

# Data — point this at your text file (WikiText-103 combined, FineWeb, etc.).
text_file: ./data/pg19_train.txt #./data/wikitext_combined.txt
block_size: 16384 #32768 #1024
batch_size: 2
val_split: 0.01

train_mode: ar
learning_rate: 0.0001
weight_decay: 0.1
#max_steps: 20000
optimizer: muon_hybrid
muon_lr_mult: 6.0                 # Muon LR multiplier on the matrix param group
muon_betas: [0.9, 0.95]          # AdamW betas for the 1D param group
muon_adjust_lr_fn: match_rms_adamw
# Epochs: an epoch is `samples_per_epoch` samples; validation + a generation follow each.
# Set num_epochs to drive the run by epochs (it then sets the step budget); otherwise the
# epoch count is derived from max_steps. (CLI: --epochs / --samples-per-epoch.)
num_epochs: 100
samples_per_epoch: 782 # 25000
gradient_accumulation_steps: 1   # accumulate grads over N batches before an optimizer step
gradient_checkpointing: false    # trade compute for memory in the refinement stack
# Periodic generation / checkpointing (in training batches; 0 = per-epoch / end only).
# (CLI: --generate-every / --save-every / --checkpoint-dir.)
generate_every: 0
save_every: 0
checkpoint_dir: ./checkpoints/hqd/pg19/
ar_graph_causal: true     # causal hierarchy graph for autoregressive training

hidden_dim: 768
num_heads: 12
num_refinement_layers: 12
num_layers: [0, 0, 0, 0]
internal_cycles: [0, 0, 0, 0]
refinement_style: unified
unified_refinement_cycles: 1
l0_cycles: 0
iterative_refinement_cycles: 0
local_connectivity_window_size: 0
compression_ratios: [16, 4, 4]
overlap_ratios: [0.5, 0.5, 0.5]
norm_type: layernorm
dropout: 0.0

attn_backend: flash
qkv_sharing: shared      # shared | separate

# Hierarchical Query Descent
use_hqd: true
hqd_query_chunk_size: 1024000000 # 4096
hqd_include_local_window: False
hqd_every_n: 4
hqd_reuse_previous: False
hqd_reuse_max_age: 0
hqd_topk_l3: 8 #8 #4 #16 #16 # 4
hqd_topk_l2: 8 #8 #4 #16 #8 #32 # 4
hqd_topk_l1: 16 #16 #4 #128 #32 #64 # 16
hqd_topk_l0: 64 #64 #64 #256 #64 #128 # 128
hqd_l0_topk_enable: True
hqd_query_level: 0       # query at L0 (token level); query_level>=1 breaks AR causality
hqd_stop_level: 0
hqd_handoff_to_l0: false
hqd_global_topk: 0 #65536
hqd_use_existing_zipper_projections: true   # reuse the zipper q/k projections
# HQD final-read attention implementation. Same edge set + same causality either way.
#   scatter : per-edge gather + segment-softmax + scatter_add (PyG). Default.
#   dense   : group each destination's edges into a padded block + fused attention.
#             Cheaper at long context; equivalent up to float-summation order.
hqd_attn_impl: scatter        # scatter | dense
hqd_dense_backend: sdpa       # sdpa | flash (flash-varlen if installed, else sdpa)
# Descent shortcut: 0 = full scored descent; 2 = skip the L1 scoring stage (take all L1
# children of selected L2 unscored, final L0 stage still prunes). BEHAVIOUR-CHANGING.
hqd_descent_stop_at: 0        # 0 | 2

# HQD final-read levels: which selected levels the L0 query attends over. [0] = L0 only
# (original behavior); [0, 1, 2, 3] also mixes selected L1/L2/L3 summary nodes into the
# attention (level-aware scoring handles cross-level q.k). Causal-safe at query_level 0.
hqd_read_levels: [0, 1, 2, 3]

# Per-level window bag: scatter the L0 routing's per-level selections back UP so coarse nodes
# (L1/L2/L3) also gain lateral reach, not just L0. [] = off.
#   per_position : each coarse node's bag = its own descendants' selections (re-targeted to the
#                  query's ancestor). STRICTLY CAUSAL (past-Δ = 0). Recommended for AR.
#   global       : one shared top-k bag per level. NOT strictly AR-causal (shared top-k sees all
#                  positions; leak ~1e-7) — use only for masked-diffusion / bidirectional.
hqd_window_bag_levels: []            # e.g. [1, 2, 3] to give coarse levels lateral reach
hqd_window_bag_routing: per_position # per_position (causal) | global (non-causal, bidi only)
# per_position: 0 = natural bound (~descendants x topk_lX edges/node); >0 = hard fixed budget
#               (top-N descendant selections per coarse node). global: shared bag size (0 -> 16).
hqd_window_bag_topk: 0

# Witness packets (requires use_hqd + hqd_query_level: 0). Each selected L1 node exposes a
# bounded packet of L0 child ids it "cannot forget"; these are force-included (via a score
# bias) into the HQD final-stage candidate set so important/rare tokens survive top-k pruning.
# Causality-safe at query_level 0 (witnesses inherit the existing candidate causal mask).
use_witness_packets: false        # master switch (default off = identical to plain HQD)
use_summary_witnesses: true       # top-k children by graph responsibility (q_parent . k_child)
use_rare_witnesses: true          # top-k by responsibility + lambda * detached surprise
summary_witness_per_head: false   # true = top-k per attention head (diversity, ~num_heads x slots)
witness_k_summary: 4              # summary witnesses per parent (per head if per_head)
witness_k_rare: 4                # rare/surprise witnesses per parent
witness_max_per_parent: 0        # cap on total witness slots/parent (0 = uncapped). Set e.g. 16
                                 # when summary_witness_per_head: true to bound candidate width.
witness_lambda_rare: 0.3         # weight on normalized aux-reconstruction surprise
witness_score_bias: 5.0          # logit bonus that force-includes witnesses past final top-k

local_attn_levels: [0, 1, 2, 3]
local_attn_windows: [32, 16, 64, 128]
local_attn_causal_levels: [0, 1, 2, 3]
l0_local_window: 128
learn_edge_from_attention: false
