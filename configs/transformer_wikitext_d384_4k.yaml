# CONTEXT 4096 (2026-09-29): block_size 1024 -> 4096, batch_size 16 -> 4, samples_per_epoch
# 15625 -> 3906, so tokens/step (16,384), steps/epoch (976), tokens/epoch (16.0M) and the LR
# schedule are UNCHANGED vs the 1024 curves: only the context grows. glob400 at 4096 no longer
# covers every coarse row: levels [4096, 512, 256, 128], the 400 budget takes L3 + L2 (384
# rows) as the prefix and leaves L1 (512) to the band. The old d768 curves are 1024-context and
# NOT comparable; the d768 width control at 4096 is pinball_wikitext_pack_glob400_d768_4k.yaml.
# TRANSFORMER CONTROL @1024, d384. Derived from transformer_wikitext.yaml by hidden_dim 768 ->
# 384, num_heads 12 -> 6, checkpoint_dir, muon_batched: true.
#
# THE d384 SET. Four arms at hidden_dim 384 / 6 heads (head_dim 64 as before), 12 layers,
# everything else as the d768 parent, all with muon_batched: true (same update; the d768
# curves ran the per-matrix step -- equivalent, not bit-identical):
#     transformer_wikitext_d384_4k.yaml                 transformer control
#     pinball_wikitext_pack_glob400_d384_4k.yaml        glob400 control
#     pinball_wikitext_pack_glob400_l0coarse_d384_4k.yaml + hier_level_qkv/ffn: l0_coarse
#     pinball_wikitext_pack_glob400_levelsep_d384_4k.yaml  + hier_level_qkv/ffn: per_level
# Readouts: (1) headroom at fixed width (all four at 384; the capacity-limited regime);
# (2) STRUCTURED vs PLAIN capacity: levelsep@384 has the NON-EMBEDDING parameter count of
# glob400@768 (data/curve_text_glob400.csv) at ~1/4 of the projection FLOPs -- one spends
# the parameters as level-specific weights, the other as width. Report non-embedding params:
# the tied 50k x 384 embedding (19.3M) is about as large as the d384 network itself.
# Same LR / schedule / optimizer as the parents for every arm.
# SCORES: (none yet)
