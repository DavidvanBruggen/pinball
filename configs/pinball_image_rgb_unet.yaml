# DIRECT PIXEL run — no VQ / no VAE. The learned RGBTokenUNet2D bridge (a small 2D conv
# U-Net on the model, trained end-to-end) encodes pixels -> token features, pinball runs
# over the token grid, the bridge decodes back to pixels with skip context, and the loss
# is v-prediction diffusion in PIXEL space (rgb_epsilon target path; auto-selected).
# Sampling re-encodes the current noisy image every step, so the decoder always has valid
# skips (this is why diffusion, not MaskGIT, is the objective here: masked-feature MaskGIT
# cannot decode from scratch without encoder context).
#
# THE POINT of this config vs pinball_image_maskgit_discrete.yaml: the VQ run compresses
# 64px -> 8x8 = 64 tokens BEFORE pinball, which is the worst regime for the hierarchy
# (fixed per-forward op count dominates at tiny T; coarse levels have ~2-8 nodes). Here
# downsample 2 gives 32x32 = 1024 tokens: pinball's own hierarchy does the compression,
# the per-forward overhead amortizes 16x, and the coarse levels get real node counts.

model_type: pinball
modality: image
tokenizer_name: gpt2            # unused in image mode (features input); kept for cli defaults

block_size: 1024                # synced by the cli to (image_size / rgb_unet_downsample)^2
batch_size: 64                  # T=1024: ~7GiB @ b32 bf16 on the 4090; Blackwell takes 128-256
val_split: 0.01

# Training
train_mode: ar                  # graph flags below force bidi; this only names the text path
learning_rate: 1e-4
weight_decay: 0.1
warmup_steps: 1000
optimizer: muon_hybrid
muon_lr_mult: 6.0
muon_betas: [0.9, 0.95]
muon_adjust_lr_fn: match_rms_adamw
num_epochs: 100
samples_per_epoch: 102400       # ~1600 steps/epoch at b64 -> preview cadence stays useful
gradient_accumulation_steps: 1
gradient_checkpointing: false
train_feature_chunked_ce_enable: false
longctx_diag_every: 0
generate_every: 0
save_every: 0
checkpoint_dir: ./pinball/image_rgb_unet/checkpoints

# --- Graph / hierarchy: identical recipe to the discrete MaskGIT config -----------------
ar_graph_causal: false          # BIDI: diffusion sees the whole (noisy) image every step
pinball_monitor_gates: true
pinball_monitor_gates_every: 100
ar_hier_edge_mode: none
drop_static_cross_level_edges: true

hidden_dim: 512
num_heads: 8
attn_sparse_qk_mult: 1.0
attn_sparse_v_mult: 1.0
num_refinement_layers: 12
num_layers: [0, 0, 0, 0]
internal_cycles: [0, 0, 0, 0]
refinement_style: unified
unified_refinement_cycles: 1
l0_cycles: 0
iterative_refinement_cycles: 0
local_connectivity_window_size: 0
compression_ratios: [16, 4, 4]
overlap_ratios: [0.5, 0.5, 0.5]
upper_init: pooled
upper_seed_gate_init: 1.0
hier_upward_refresh: true
hier_upward_refresh_every: 1
hier_upward_refresh_gate_init: 0.1
hier_downward_refresh: true
hier_downward_refresh_every: 1
hier_downward_refresh_gate_init: 0.1
hier_refresh_compile: true
# Compile each refinement layer's forward (widest compileable region; whole-model dynamo
# breaks on the cache bookkeeping). Fuses the eager orchestration around flash/pack —
# the launch-bound cost at short sequences. Training-only, probation fallback to eager.
hier_layer_compile: true
xq_nominate_enable: false       # causal machinery; stays off in bidi
use_hqd: false

local_pack_cross_level: true
local_pack_window: 624          # ~128-token spatial-blob reach at 1024-token grids
local_pack_query_levels: [0, 1, 2, 3]
local_pack_level_bias: true
local_pack_coarse_lane: true
local_pack_coarse_window: 896
local_pack_flex_union: false
local_pack_lane_merge: false
norm_type: layernorm
dropout: 0.1
gen_frontier_consistent: false

attn_backend: flash
qkv_sharing: shared
cross_level_packed: false
cross_level_qkv: shared
per_level_ffn_dims: []
per_level_attn_mult: []
local_attn_head_dim: 0
local_attn_levels: [0, 1, 2, 3]
local_attn_windows: [128, 128, 128, 128]
local_attn_causal_levels: [0, 1, 2, 3]
l0_local_window: 128
use_edge_embedding: false
learn_edge_from_attention: false
lateral_edge_trace_enable: false
token_unet_enable: false        # the RGB bridge below is the stem; the 1D token U-Net stays off

pinball_multirate_enable: false
pinball_upper_refine_steps: 0
pinball_top_refine_steps: 0
pinball_upper_cross_attn_steps: 0
pinball_cross_query_pairs: ["1:3", "0:3"]
pinball_cross_query_steps: 2
pinball_cross_query_topk: 0
pinball_cross_query_memory_window: 32768
pinball_cross_query_causal: true
pinball_cross_query_shared_weights: true
pinball_cross_query_write_scale_init: 0.1
pinball_l3_workspace_tokens: 8

use_aux_loss: true
hier_predaux_enable: true
lambda_hier_predaux: 0.05
hier_predaux_levels: [1, 2, 3]
hier_predaux_horizon: 0
hier_predaux_loss_mode: mse
hier_predaux_predictor: mlp
hier_predaux_directions: both
hier_copredict_l0: false

# ============================================================================
# IMAGE MODALITY: raw pixels + learned CNN bridge + pixel-space diffusion
# ============================================================================
spatial_curve: hilbert
# spatial_dims: left unset — the cli derives [image_size/ds, image_size/ds] = [32, 32]
local_pack_rope_axial: true
local_pack_bidirectional: true
hier_downward_bidi_parent: true

image_dataset_root: /media/david/SSD_Data/Datasets/tiny-imagenet
image_size: 64
image_num_classes: 200
image_objective: diffusion
image_token_mode: rgb_unet
image_roundtrip_check: false    # the bridge is LEARNED — an init-time roundtrip is noise by design
image_num_workers: 8            # pixels needed every step (no latent/token cache applies)
image_cache_mode: off           # cache shards store latents/VQ tokens, not pixels
image_auto_prepare: true
image_hf_dataset_id: zh-plus/tiny-imagenet
image_prepare_streaming: true
image_prepare_max_train: 0
image_prepare_max_val: 0
image_prepare_overwrite: false

# RGB bridge (the CNN stem): downsample 2 -> 32x32 grid = 1024 tokens at 64px.
# n_down = log2(ds) = 1 conv stage each way; token_dim is the feature width pinball sees.
image_rgb_unet_token_dim: 64
image_rgb_unet_downsample: 2
image_rgb_unet_base_channels: 64
image_rgb_unet_kernel_size: 5
image_rgb_unet_decode_kernel_size: 3
image_rgb_unet_decode_separable: true
image_rgb_unet_max_channels: 512

# Diffusion (pixel-space v-prediction; target/prediction "auto" resolve to
# rgb_epsilon + v for rgb_unet mode).
image_diffusion_steps: 1000
image_diffusion_schedule: cosine
image_diffusion_target: auto
image_diffusion_prediction: auto
image_rgb_centered_diffusion: true
image_diffusion_min_snr_gamma: 5.0   # min-SNR loss weighting; standard for v-pred pixel diffusion
image_diffusion_beta_start: 1e-4
image_diffusion_beta_end: 2e-2

use_ema: true
image_class_cond_drop_prob: 0.1

image_preview_enable: true
image_preview_eval_interval: 1
image_preview_num_samples: 8
image_preview_guidance_scale: 1.0
image_preview_diffusion_steps: 36    # respaced from the 1000 train steps; keeps previews fast
image_fid_enable: false
image_fid_eval_interval: 0
image_fid_num_samples: 2048
image_fid_guidance_scale: 3.0
