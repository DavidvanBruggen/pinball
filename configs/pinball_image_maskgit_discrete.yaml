# Pinball hierarchical graph transformer — autoregressive LM on WikiText-103.
# PACKED CROSS-LEVEL LOCAL run: pinball_wikitext_cleaner.yaml + local_pack_* on
# (all-levels mixed window, level tags). Fresh runs only — do not warm-start from
# non-pack checkpoints (L0's local attention distribution changes).
# Friendly toggles (attn_backend / qkv_sharing / train_mode / use_hqd) expand to the
# underlying flags in pinball.config.PinballConfig. See README for the full toggle table.

model_type: pinball
modality: text
tokenizer_name: gpt2

# Data — point this at your text file (WikiText-103 combined, FineWeb, etc.).
text_file: "" #/home/david/Projects/hgt_geomet/proj-oc/hierarchical-graph-transformer/wikitext_103_raw/wikitext_combined.txt #./data/pg19_train.txt
block_size: 1024                  # = 32*32 VQ/latent grid (H*W); cli syncs to the real grid
batch_size: 256
val_split: 0.01

# Training
train_mode: ar            # ar | masked_diffusion
learning_rate: 1e-4 #0.0001
weight_decay: 0.1
warmup_steps: 1000
#max_steps: 20000
# Optimizer: adamw | muon_hybrid. muon_hybrid trains 2D+ weight matrices with Muon at
# learning_rate * muon_lr_mult (RMS-matched to AdamW), and 1D params (embeddings, norms,
# biases) with AdamW at the base LR — usually learns markedly faster than plain AdamW.
optimizer: muon_hybrid
muon_lr_mult: 6.0                 # Muon LR multiplier on the matrix param group
muon_betas: [0.9, 0.95]          # AdamW betas for the 1D param group
muon_adjust_lr_fn: match_rms_adamw
# Epochs: an epoch is `samples_per_epoch` samples; validation + a generation follow each.
# Set num_epochs to drive the run by epochs (it then sets the step budget); otherwise the
# epoch count is derived from max_steps. (CLI: --epochs / --samples-per-epoch.)
num_epochs: 100
samples_per_epoch: 1024000 #25600          # 800 steps/epoch at b32 -> 20k steps total (~0.5 ImageNet epochs)
gradient_accumulation_steps: 1   # accumulate grads over N batches before an optimizer step
gradient_checkpointing: false    # trade compute for memory in the refinement stack
# Chunked CE loss head: the model emits token FEATURES and the loss projects + cross-entropies
# in seq-chunks of `chunked_ce_seq_chunk`, never materializing the full [B,T,vocab] logits (+ its
# softmax/CE backward). At B=8,T=1024,V=50257 that head is ~3.3GB -> chunking it is the main
# memory lever AFTER gradient_checkpointing (which only frees refinement-layer activations, not
# weights/grads/optimizer/loss-head). Loss-equivalent. chunk e.g. 256 (=4 chunks over T=1024).
# The position-chunk auto-scales UP for small batch (>= ~2048 tokens/chunk = B*chunk), so a long
# sequence at batch 1 stays a few big chunks instead of hundreds of tiny launch-bound ones.
# 2026-07-13: enabled — the chunked CE's old [B,V,T] "spatial" cross-entropy kernel was ~7x
# slower than the flat 2D form (trainer now reshapes; bit-identical, verified). Measured at
# T=8192, V=50257: chunked 2D = 34.5ms vs 37.8ms full-logits, peak head memory 5.66 -> 2.97 GiB.
train_feature_chunked_ce_enable: true
chunked_ce_seq_chunk: 64
# Long-context diagnostic: every N validations, log next-token PPL bucketed by in-context
# recurrence distance (never / <128 / 128-511 / 512-2k / >2k). Cheap — reuses the val batches,
# no extra forward. The split that matters: <128 (inside local window) vs >=128 (needs the
# hierarchy). 0 = off. longctx_diag_max_seqs caps sequences scanned per run (default 64).
longctx_diag_every: 1
# longctx_diag_max_seqs: 64
# Periodic generation / checkpointing (in training batches; 0 = per-epoch / end only).
# (CLI: --generate-every / --save-every / --checkpoint-dir.)
generate_every: 0
# Generation prompt/continuation lengths. gen_prompt_tokens defaults to min(64, block_size//2);
# raise it for long-range PG19 conditioning (must be <= block_size). Leave sample_prompt unset
# so the prompt is sampled from held-out val text rather than a fixed short string.
gen_prompt_tokens: 512
gen_max_new_tokens: 512
save_every: 0
#checkpoint_dir: ./pinball/pooled_proj_test_stemwarm_hqd/checkpoints
#checkpoint_dir: ./pinball/pooled_proj_test_stemwarm_hqd/checkpoints
#checkpoint_dir: ./pinball/pooled_proj_test_crossthinking_crosslvledges/checkpoints
#checkpoint_dir: ./pinball/pooled_proj_test_crossthinking_copredict_l3q/checkpoints
# CLEANER-PINBALL test config: the vertical STATIC scatter backbone is retired entirely and
# replaced by dense linear-cost ops — per layer: local flash attention + upward refresh (pool)
# + downward refresh (most-recent-closed gather from every coarser level); content-addressed
# far reads via the midpoint cross-query (L3 memory); coarse objectives via recon aux + predaux.
# Graph construction stays intact, so dynamic edges (HQD / zipper) remain fully available —
# they inject ephemeral edges at attention time on top of the (now self-loop-only) static set.
checkpoint_dir: ./pinball/image_maskgit_discrete/checkpoints
#log_every:             # emit the Step/EFF/Cache log lines every N steps (CLI: --log-every)
# Resume: restores weights + optimizer + LR schedule + step/epoch counters and continues.
# resume_from: ./checkpoints/pinball_final.pt   # (CLI: --resume)

# AR graph connectivity — make the hierarchy graph causal for autoregressive training.
# ar_graph_causal sets hier_ar_enable + l0_ar_enable together; the individual dials below
# (any of them) can be set directly for fine-grained control.
ar_graph_causal: false           # BIDI (MaskGIT): hier/l0 AR off -> two-sided pack via local_pack_bidirectional
# Debug: periodically log the essential learnable gates/scales (copredict head gates, cross-query
# write scales, upper/top refiner level scales) so you can watch which pathways open or collapse.
# Also callable directly: model.gate_monitor() -> {name: value}.
pinball_monitor_gates: true
pinball_monitor_gates_every: 100    # forward calls between logs
# Which strictly-past (leak-free) coarse->L0 scheme AR turns on by default so the hierarchy
# feeds L0 (the AR filter otherwise cuts every downward coarse->L0 edge, going inert):
#   staggered : DIRECT one-hop edges into L0 from each level -> L0<-L1, L0<-L2, L0<-L3 (the
#               ancestor NODE per level is picked by a staggered past-walk, but every edge lands
#               on L0, so L3 reaches L0 in ONE hop). ensure_l0_past_parent_edges. DEFAULT.
#   bridges   : ADJACENT-RUNG chain -> L0<-L1, L1<-L2, L2<-L3 (L3 reaches L0 only MULTI-hop, via
#               the intermediate levels; a direct L0<-L2 / L0<-L3 is added ONLY if you also set
#               enable_l0_parent_edges). ensure_past_hier_edges_all_levels.
#   both | none. Explicit ensure_* flags still override this.
# cleaner-pinball: no AR bridge/staggered edges — the downward refresh below carries the
# recency-based vertical flow as a dense gather, and the static cross-level scatter edges are
# dropped from the refinement edge set entirely (dynamic HQD/zipper edges unaffected).
ar_hier_edge_mode: none
drop_static_cross_level_edges: true
# hier_ar_enable: true            # level-wise edges are time-forward only
# l0_ar_enable: true              # L0 intra-level edges are causal (time-forward only)
# hier_ar_allow_same_time: true   # allow src_time == dst_time edges
# enable_l0_parent_edges: false   # add L0->parent edges across levels
# l0_parent_edges_bidirectional: false
# ensure_l0_past_l1_edges: false  # guarantee each L0 node sees past L1 nodes
# ensure_past_hier_edges_all_levels: false
# long_range_distance: 3      # max graph hops for long-range edges

# Core shape
hidden_dim: 1536 #512                   # 68M @ 512/8: the 16385-way VQ head needs width (192 is rank-starved);
num_heads: 24                      # head_dim stays 64 (flash sweet spot). 270ms/step b32@1024 Blackwell.
# Fat-QKV (sparse paths only): decouple the Q/K and V head dims from hidden_dim/num_heads
# on the SPARSE-SCATTER attention. Flash local-window attention is unaffected (it requires
# qk==v head_dim). Both default 1.0 = off (bit-identical).
#   attn_sparse_v_mult : widen v_head_dim — a richer value payload carried THROUGH the sparse
#     aggregation (the capacity a dense model can't afford), down-projected on output. Applies
#     to BOTH sparse paths: the cross-level (vertical) message passing AND the HQD read.
#   attn_sparse_qk_mult: widen qk_head_dim. Your head_dim is 64 < model_dim 128, so the per-head
#     routing form is rank-capped at 64; mult 2.0 -> head_dim 128 = full rank. Helps up to ==128.
#     Applies to the cross-level message passing; the HQD descent SELECTION stays at head_dim
#     (its q/k entangle with the shared zipper-qk cache + witness scoring — widening there is a
#     separate follow-up). HQD still gets the fat-V payload above.
# (To add more independent routing patterns instead, raise num_heads above — uncapped, compounding.)
attn_sparse_qk_mult: 1.0    # try 2.0 to lift cross-level routing rank 64 -> 128
attn_sparse_v_mult: 1.0     # try 2.0 / 4.0 for fat-V (both sparse paths)
num_refinement_layers: 12 #12
num_layers: [0, 0, 0, 0]
internal_cycles: [0, 0, 0, 0]
refinement_style: unified
unified_refinement_cycles: 1
l0_cycles: 0
iterative_refinement_cycles: 0
local_connectivity_window_size: 0 # set so graph windows are made dense (k=window_size*2+1) for local connectivity. 0 = sparse only.
compression_ratios: [16, 4, 4]
overlap_ratios: [0.5, 0.5, 0.5]
# Coarse-node seeding (the ORIGINAL design, restored). mask = coarse nodes start as mask
# embeddings and content must climb the hierarchy through the refinement layers (measured:
# L3 only fills at layer 11 of 12 — the summary forms too late to be read back). pooled =
# seed each coarse node bottom-up with the level-projected mean of its child window
# (reuses level_projections), blended by a learnable per-level gate:
#   seed = mask + gate * (pooled - mask);  gate init upper_seed_gate_init.
# Causal: a coarse node's AR time is its window END, so pooling the full window reveals
# nothing beyond what the causal upward edges already deliver. Warm start: set gate 0.0
# (exactly reproduces mask init) and let it learn; fresh runs use 1.0.
upper_init: pooled            # mask | zeros | pooled
upper_seed_gate_init: 1.0
# Per-layer UPWARD REFRESH (late-ascent fix, part 2 — the seed above is part 1). After every
# k-th refinement layer, re-pool each level's child-window mean into its parent with a gated
# residual, bottom-up (L1 from the current L0, then L2 from the UPDATED L1, ...): abstraction
# ascends EVERY layer instead of accumulating until layer ~11, so the downward reads (bridges +
# cross-query below) see a current summary at every depth. Same window rule + causality as the
# pooled seed (parent ar_time = window end). Cost is one mean+Linear on the coarse slices, O(N).
# gate init 0.0 = exact no-op (warm-start bit-identical); 0.1 forces it open on fresh runs
# (the 0.01-init write scales collapsed last run; 0.1 held).
hier_upward_refresh: true
hier_upward_refresh_every: 1        # apply after every layer
hier_upward_refresh_gate_init: 0.1
# Per-layer DOWNWARD REFRESH — the dense replacement for the bridges scatter: each fine node
# gathers the most-recent CLOSED node of each coarser level (the exact node a bridge edge
# points at), projected per pair + gated residual. Project-then-gather => O(N), no attention,
# no scatter. Chained top-down, so L3 reaches L0 within one layer. The cross-query below stays
# as the content-addressed read (recency vs relevance are different queries).
hier_downward_refresh: true
# hier_downward_refresh_pairs: ["0:1","0:2","0:3","1:2","1:3","2:3"]   # default: all downward
hier_downward_refresh_every: 1
hier_downward_refresh_gate_init: 0.1
# The refreshes are kernel-LAUNCH-bound (many tiny ops x 12 layers): torch.compile fuses them,
# measured ~14% whole-step win at seq 8196. Training mode only (fixed seq len = one compile);
# eval/generation stay eager. Additional lever if needed: *_refresh_every: 2 (~12% win, stacks).
hier_refresh_compile: true
# Compile each refinement layer's forward (widest region below the model-level forward,
# whose cache bookkeeping breaks dynamo). Fuses the launch-bound eager orchestration —
# measured +14% at T=64 and +26% at T=1024 alone; 1.8x combined with refresh compile at
# T=1024 (2026-07-17, 4090 under contention). Training-only, probation fallback to eager.
# OFF here: flipping it mid-experiment changes step numerics slightly vs your running curve.
hier_layer_compile: false
# HQD v2 — cross-query-guided nomination (NSA-style selective sparse attention). At the
# multirate midpoint each L0 query scores the CLOSED L3 windows with the 0:3 refiner's TRAINED
# q/k (per-query, causal), descends into the top-k winners' L1 children (cosine), and
# nominates the winning L1 nodes' L0 children as ephemeral L0->L0 edges for all post-midpoint
# layers (v1 HQD's injection path — works with the static edges dropped; children tables come
# from window arithmetic, not edge lists). This is the DYNAMIC content-addressed read the
# recency gathers can't do. OFF for the baseline cleaner run; flip on for the retrieval test.
xq_nominate_enable: false
# RECALL knobs (stage 1/2 shortlist width). Since the stage-3 scored prune fixes the read
# at topk_l0 sources/query, widening these grows ONLY the nomination scoring cost (~4.5ms/
# round, roughly linear) — NOT the per-layer read. 8 L3 windows ~= 700 tokens of candidate
# span (4 was ~350 of an 8k context — the stage-1 shortlist is the recall bottleneck).
xq_nominate_topk_l3: 8         # closed L3 windows shortlisted per query
xq_nominate_topk_l1: 8        # L1 winners kept among the shortlist's children
xq_nominate_exclude_local: true  # spend the edge budget beyond the L0 local window
# SCHEDULING — two ORTHOGONAL dials:
#   xq_nominate_every      = when to re-SELECT: a fresh nomination every k layers, using the
#                            evolved queries (multi-hop retrieval). 0 = select once/forward.
#   xq_nominate_max_layers = how many layers each selection FEEDS (each read ~7ms/step at
#                            seq 8k B=2). 0 = no cap (feed until the next round or stack end).
# "Once and reuse everywhere" = every: 0 + max_layers: 0. With every==max_layers (as here)
# the cap never binds — every layer past after_layer reads. Speed dial: max_layers: 1
# halves the read cost while keeping selection freshness.
xq_nominate_max_layers: 1
# When to nominate: auto = after the middle layer; or an int (1-based, "after k layers").
# 4 = earlier retrieval so the fetch integrates over more depth.
xq_nominate_after_layer: 4
xq_nominate_every: 2
# --- v2.1 (2026-07-10, from the 100ep diagnosis: saturated indiscriminate fetch, mostly-
# padding reads, untrained stage-2 metric, scatter-read memory cost) ---------------------
# Stage-3 scored prune: score the L1 winners' L0 children with the SAME shared RoPE'd q/k
# the consuming read uses (NSA select-what-you'd-attend-to) and keep top-k. Without it every
# query dumped ~48 mostly-padding sources. 0 = legacy all-children.
xq_nominate_topk_l0: 16
# Consume nominations as a packed fixed-K per-query table (dense GEMM read) instead of the
# per-edge scatter list — same math, a fraction of the train memory (the scatter path's
# per-edge autograd gathers were the 165->110 tok/s cost). Requires topk_l0 > 0.
xq_nominate_packed_read: true
# Per-query relevance gate: read output scaled by sigmoid(w*stage1_top_score + b) — a no-op
# option for queries with nothing to fetch (ungated reads HURT never-recurring tokens by
# ~1.6%) and a task gradient into the 0:3 selector q/k (NSA-style selector training).
xq_nominate_gate_enable: false
# Stage-2 (L1 descent) scoring: local_qk = the layer's trained per-level q/k (the raw-cosine
# default was a speed placeholder). No new params.
xq_nominate_stage2: local_qk
# 2026-07-15 far-fetch fixes. prerope: the RoPE'd L0<->L0 geometry is only trained inside the
# ~128-token local window, so scoring/reading fetches at true far rotations is OOD noise ->
# the selector retreats near (mean_dist collapsed 2k -> 990 over the last run). Pre-RoPE q/k
# = content-only matching for the stage-3 prune + the packed read. sink: learned zero-value
# slot in the read softmax so a query with no useful candidates can no-op (the forced read is
# why first-occurrence tokens measured WORSE with xq on). Fresh-run knobs for the read path.
xq_nominate_read_prerope: true
xq_nominate_read_sink: true
# NOTE (2026-07-10): the pre-v2.1 nomination projected the 0:3 refiner q/k inside no_grad
# UNDER AUTOCAST — the first-call bf16 weight-cast cache then fed a DETACHED cast to the
# multirate episode's grad-mode call, so the cross-query projections received NO gradient
# for the entire run (the 100ep hqd run trained its main long-range read frozen at init —
# do not compare that ckpt's far-recall against baselines). Fixed: nomination now projects
# in grad mode and detaches for selection. Same latent bug class exists in v1 HQD/witness
# no_grad selection when use_hqd: true.
# PACKED CROSS-LEVEL LOCAL ATTENTION (2026-07-12, prototype): interleave ALL levels' nodes
# by close time (ar_time; ties coarse-first, matching hier_ar_allow_same_time) and run ONE
# causal sliding-window flash over the mixed sequence, replacing the per-level local call
# for local_pack_query_levels. Fine queries then read the recent CLOSED coarse summaries
# (staggered ancestors) and coarse queries read their strictly-past children INSIDE the
# same softmax as their lateral neighbors — per-query/per-head softmax competition between
# local detail and coarse gist, vs the scalar-gated downward/upward refresh writes. RoPE at
# token-scale close positions. Leak-free by construction (causal over close-time order).
# Strides 8/16/32 => ~22% slot dilution: a 128-slot window spans ~105 tokens + ~23 coarse
# rows (raise local_pack_window to ~156 to hold token-reach; the L3 rows extend EFFECTIVE
# reach far beyond either). FRESH-RUN knob (changes L0's local distribution). Generation
# falls back to full rebuild (packed tail decode not built). Default [0] keeps L1-L3
# lateral windows untouched; add 1-3 to route coarse laterals through the mixed window too.
# THIS CONFIG: the pack experiment (vs pinball_wikitext_cleaner.yaml = identical run with
# pack off). ALL levels query through the mixed window — coarse laterals move from their
# 128-same-level-node windows (1k-4k token span) into the ~130-token mixed span. Measured
# FASTER than baseline (-8.5%: one flash call over 9984 rows replaces four per-level calls);
# the open question is whether the coarse-lateral repositioning hurts or helps quality.
# Fall back to query_levels [0] to keep coarse laterals untouched (+2% cost instead).
local_pack_cross_level: true
local_pack_window: 624            # ~128-token spatial blob reach at 1024-token grids (1248 would be near-global) # 156 624 1248
local_pack_query_levels: [0, 1, 2, 3]
# Level tags for the mixed softmax: flash can't take the scatter path's level-pair logit
# bias, so zero-init per-level per-head embeddings are added to the RoPE'd K (q·e_level =
# query-dependent level bias) and to V (output carries its source level). Zero init =
# exactly the untagged packed call at step 0.
local_pack_level_bias: true
# COARSE LANE: second packed causal window over ONLY the L1-L3 rows (close-time order),
# restoring the wide coarse LATERAL reach the hierarchy's economics lean on — the main
# mixed window is ~78% tokens, which cuts coarse laterals to ~16 same-level neighbors.
# Lane slots are all coarse (7 per 32 tokens): 896 slots = 4096 tokens of span = L3's full
# pre-pack window (128 L3 + 256 L2 + 512 L1 in-window; L1/L2 lateral reach even grows vs
# their old 1024/2048-token spans). Cost ~ the main packed call again (coarse rows are few).
# Additive to the coarse queries' main-window read (fine detail stays available there).
local_pack_coarse_lane: true
local_pack_coarse_window: 896    # covers most coarse laterals at 1024-token grids (L1 128 / L2 64 / L3 32 rows)
# UNIFIED SOFTMAX over both windows (2026-07-13): coarse queries read the mixed window and
# the lane as ONE softmax over the union of both key sets, instead of adding two
# independently-normalized outputs (per-key context-selective arbitration; kills the
# overlap double-count). Fallback chain: flex -> lse-merge -> additive.
#   local_pack_flex_union — ONE flex_attention call, block-sparse union mask over a
#     [coarse|tokens] block-coherent layout; exact dedup, flash-style tiled softmax
#     (Triton). ~6% step at b4@8196. No attention-prob dropout on this path.
#   local_pack_lane_merge — differentiable LSE merge of the two flash calls (equivalent
#     softmax up to a +ln2 bias on overlap keys); runs only if flex fails at runtime.
# FRESH-RUN knobs (they change the function vs the additive pack checkpoints).
local_pack_flex_union: false
local_pack_lane_merge: false
norm_type: layernorm
dropout: 0.1

# Frontier-consistent AR generation: a raw prefix builds TRUNCATED coarse windows, so the token
# being predicted reads its own OPEN parent — but in training that parent's full window extends
# past it and is causal-cut. This pads the prefix forward by the top-level coarse window span
# (causally-invisible pad tokens) so the frontier sees the SAME closed-window context as training.
# Verified bit-exact; fixes "generate with only the graph" gibberish. Costs ~span extra tokens/step.
gen_frontier_consistent: false   # AR-gen machinery; unused in MaskGIT

# Attention / hierarchy toggles
attn_backend: flash        # pyg | flash | sdpa
qkv_sharing: shared      # shared | separate
# Tier-3 packed cross-level backbone attention: a dense/batched fast lane for the
# cross-level message passing (groups each destination's parents into a padded fixed-K
# block per level, runs [B,Q,K,H,D] attention instead of gather/segment-softmax/scatter).
# Mathematically identical to the scatter default (validated 2.1e-6); scatter stays the
# default + the fallback for every graph feature it can't pack (edge feats/conditioning,
# learned edges, trace, witnesses, fat-QKV). ~1.2-1.3x on uniform cross-level degree;
# pays off on large/dense graphs, negligible at this config's sparse cross-level edges.
# ALSO the (free) capture point for hqd_packed_witness_source: backbone — flip to true
# when running HQD with the backbone witness source.
cross_level_packed: false
# Per-level cross-level (backbone + HQD) QKV. With qkv_sharing:separate the WINDOWS already
# have per-level QKV; this gives the VERTICAL (cross-level) path the same, so an L0 query
# attends to an L3 key in a level-specific subspace (vs today's single shared projection +
# additive level-pair bias). Feeds packed/scatter cross-level AND the HQD selector; the local
# window path keeps its own QKV. Copy-initialized from shared (starts bit-identical, fp32
# parity 0.0). ~1-3% slower (same FLOPs, each node projected once by its level). Modes:
#   shared        : single q/k/v_proj for all levels (default, current behaviour)
#   per_level_qk  : per-level Q and K, shared V  (~+57M params; routing lives in q.k)
#   per_level_qkv : per-level Q, K and V         (~+85M params; max expressiveness)
#   reuse_local   : reuse the per-level LOCAL window projections (no new params)
cross_level_qkv: shared
# Per-level FFN dims (U-Net-style capacity schedule in the HIERARCHY, no separate U-Net needed).
# Each level's FFN gets its own SwiGLU expansion width (inner ~ 4*2/3*dim_L): L0 has ~all the
# nodes so a SMALL dim makes the FFN CHEAPER where it dominates; coarse levels (few nodes) get a
# LARGE dim = capacity at the "bottleneck", like a U-Net's channel growth. Input/output stay
# hidden_dim (residual + cross-level attention unaffected). Compute drops (L0 shrunk); params
# grow (big coarse FFNs, few nodes). [] = uniform (default). e.g. [384, 768, 1152, 1536] for L0..L3.
per_level_ffn_dims: [] #[192, 384, 1152, 1536]
# Per-level LOCAL-attention dim (the big lever — attention is ~84% of graph compute). Each level's
# window attention runs at num_heads_L = round(mult_L * num_heads) heads, head_dim FIXED at 64
# (full per-head resolution). L0 (most nodes) fewer heads = cheaper; coarse levels more heads =
# capacity (U-Net schedule). q/k/v scale together (shared num_heads). hidden->d_L q/k/v + d_L->
# hidden out proj per level (Fat-QKV pattern); cross-level stays hidden. Flash-only. [] = uniform.
# e.g. [0.5, 1.0, 1.5, 2.0] -> heads [6,12,18,24].
per_level_attn_mult: [] #[1, 1, 1, 1]
# Local-attention head_dim override (NARROW residual, WIDE attention). 0 = hidden//num_heads.
# With a small hidden_dim (e.g. 192, head_dim 16), set this to 64 to UP-PROJECT the local
# attention q/k/v to num_heads*64 (full-resolution heads) and project back to hidden. Everything
# else (FFN, cross-level, output head, embeddings) stays at the cheap small hidden; only the
# attention is widened -> ~4x cheaper than a full hidden-768 model at comparable attention res.
# Requires per_level_attn_mult set (even [1,1,1,1] for a uniform up-projection). Its own RoPE
# is built at this head_dim. Flash-friendly at 64/128.
local_attn_head_dim: 0
use_hqd: false              # enables packed witness runtime hook
hqd_query_chunk_size: 1024000000 # 4096
hqd_include_local_window: False
hqd_every_n: 3                 # packed witness read every refinement layer
# Shift the every-N schedule: HQD runs at layers offset, offset+n, ... (default 0 =
# layers 0,3,6,9). With hqd_packed_witness_source: backbone set offset >= 1 so every HQD
# layer already has a packed-lane capture from an earlier layer — otherwise the layer-0
# build falls back to a recompute (pays both builds).
hqd_every_n_offset: 1
hqd_reuse_previous: false
hqd_reuse_max_age: 0
hqd_topk_l3: 4 #8 #4 #16 #16 # 4
hqd_topk_l2: 4 #8 #4 #16 #8 #32 # 4
hqd_topk_l1: 4 #16 #4 #128 #32 #64 # 16
hqd_topk_l0: 8 #64 #64 #256 #64 #128 # 128
hqd_l0_topk_enable: True
hqd_query_level: 0       # query at L0 (token level); query_level>=1 breaks AR causality
hqd_stop_level: 0
hqd_handoff_to_l0: false
hqd_global_topk: 0 #65536
hqd_use_existing_zipper_projections: true   # reuse the zipper q/k projections
# HQD final-read attention implementation. Same edge set + same causality either way.
#   scatter : per-edge gather + segment-softmax + scatter_add (PyG). Default, robust.
#   dense   : group each destination's edges into a block + fused attention. Only wins
#             when the HQD apply is a bottleneck AND degrees are ~uniform (bounded K).
#             PROFILED: with witnesses + bag + read_levels the apply is only ~3-6ms of a
#             ~164ms step and degrees are ragged (L0 ~28 vs coarse ~128), so dense gives
#             ~no speedup. dense/sdpa pads to max degree => wasteful on ragged sets (auto
#             falls back to scatter past hqd_dense_max_pad_ratio); dense/flash (ragged)
#             ties scatter. Keep scatter unless you have a bounded uniform edge set.
hqd_attn_impl: scatter        # scatter | dense; inert when hqd_packed_witness_read=true succeeds
hqd_dense_backend: flash       # sdpa | flash (flash-varlen if installed, else sdpa)
# Recompute the existing parent->L0 witness table, but consume selected rows as packed
# fixed-K reads inside message passing. This avoids materializing a flattened L0 witness
# edge list while preserving the old summary/rare witness selection behavior.
hqd_select_inside_message_passing: false
hqd_graph_witness_enable: false
hqd_graph_witness_topk: 4      # per-level direct-child beam width (graph AND backbone sources)
hqd_packed_witness_read: true
# Witness selection source:
#   recompute : re-score every L0 descendant against the current layer's q/k (exact, costs
#               a table build; witness_reuse: step amortizes it to 1x/forward).
#   graph     : harvest from the SCATTER path's per-edge weights (slow: ragged segment
#               sort per level; forces the non-flash/scatter path — the original design).
#   backbone  : harvest from the PACKED cross-level lane's dense attention logits — the
#               "reuse the attention already computed" design, near-free (one detached
#               topk per level). L3->L0 bags are a beam over per-level direct-child top-k
#               (width hqd_graph_witness_topk) scored by summed logits (+ surprise for the
#               rare slots). REQUIRES cross_level_packed: true; until the first capture of
#               a forward lands (the layer-0 HQD build) it falls back to recompute.
hqd_packed_witness_source: backbone # recompute | graph | backbone
hqd_packed_witness_chunk_size: 2048
# Descent shortcut ("bag instead of descend"). 0 = full scored descent (L3,L2,L1,L0).
#   2 = score L3,L2 then take ALL L1 children of the selected L2 nodes unscored (skip the
#       L1 scoring stage); the final L0 stage still scores + prunes to topk_l0. Saves one
#       scoring pass. BEHAVIOUR-CHANGING (alters selection) — validate quality with a run.
hqd_descent_stop_at: 0       # 0 | 2
# Shallow bag read ("L0 queries L3, bags down"): stop the SCORED descent at this level and
# reach L0 only through the selected coarse nodes' precomputed bags, skipping the L2/L1/L0
# scoring stages (the ~18ms cost). 0 = off. 3 = score L3 only. 2 = score L3,L2. REQUIRES the
# stop level in witness_levels (the bag is the only path to L0) and use_witness_packets: true.
# Causal for AR (bag = causal key + src<=dst). Behaviour-changing — validate quality.
hqd_shallow_read_level: 3     # 0 | 2 | 3
# Bidirectional coarse routing (option 2): coarse nodes attend among themselves (few nodes =
# cheap) and matched pairs surface bag<->bag L0 edges — long-range mixing without every token
# descending. NOT AR-causal (coarse-as-query leaks); auto-disabled under AR with a warning.
# Use only for masked-diffusion / bidirectional (e.g. masked image, DNA). [] = off. Requires the
# routed levels in witness_levels.
hqd_coarse_route_levels: []   # e.g. [3] or [2,3]
hqd_coarse_route_topk: 8      # neighbours each coarse node routes to
# Original HQD edge-read settings are kept inert by hqd_packed_witness_read=true:
# the runtime selector returns only packed L0 witness ids and never materializes the
# old flattened HQD L0/coarse edge list. Keep these minimal as a safety/default.
hqd_read_levels: [0]

# Recomputed witness packets are the selection source for packed reads; they are not
# materialized as old sparse HQD edges when hqd_packed_witness_read=true succeeds.
use_witness_packets: true        # build parent->L0 witness table
# Witness-table build frequency. layer = rebuild inside every HQD layer (selection follows
# each layer's q/k exactly). step = build ONCE per forward (first HQD layer) and reuse for
# the rest of the step — q/k drift slowly and the witness top-k is coarse, so selection is
# ~unchanged while the rebuild (the main witness-side cost) drops to 1x per step.
witness_reuse: layer              # layer | step, layer to prevent multirate to reuse a pre upper cycling witness table, but use a fresh one, slower but more accurate
use_summary_witnesses: true      # top-k children by graph responsibility (q_parent . k_child)
use_rare_witnesses: true         # top-k by responsibility + lambda * detached surprise
summary_witness_per_head: false  # true = top-k per attention head (diversity, ~num_heads x slots)
witness_k_summary: 4             # summary witnesses per parent (per head if per_head)
witness_k_rare: 4               # rare/surprise witnesses per parent
witness_max_per_parent: 8      # cap on total witness slots/parent (0 = uncapped). Bounds the
                                # candidate width so per_head*num_heads can't blow up cost: the
                                # build is ~0.6% of a step, the inflated candidate set is what scales.
witness_levels: [1,2,3]             # packed shallow L3 read looks up selected L3 rows only.
                                # [1,2,3] also builds cross-level L2->L0 / L3->L0 bags so a coarse
                                # selection reaches its important L0 descendants without descending.
                                # Causal-verified for AR; enables the shallow-read / coarse-route paths.
witness_lambda_rare: 0.3        # weight on normalized aux-reconstruction surprise
witness_score_bias: 5.0         # logit bonus that force-includes witnesses past final top-k

# Per-level window bag: scatter the L0 routing's per-level selections back UP so coarse nodes
# (L1/L2/L3) also gain lateral reach. [] = off. Requires use_hqd: true.
#   per_position : each coarse node's bag = its own descendants' selections. STRICTLY CAUSAL.
#   global       : one shared top-k bag/level. NOT AR-causal (bidi / masked-diffusion only).
hqd_window_bag_levels: []       # old HQD edge-bag path disabled; packed witnesses carry long reads
hqd_window_bag_routing: per_position # per_position (causal) | global (non-causal, bidi only)
# per_position: 0 = natural bound (every descendant selection, ~descendants x topk_lX per node);
#               >0 = hard fixed budget (top-N descendant selections per coarse node by score).
# global: the shared bag size per level (0 -> 16).
hqd_window_bag_topk: 0

local_attn_levels: [0, 1, 2, 3]
local_attn_windows: [128, 128, 128, 128]
local_attn_causal_levels: [0, 1, 2, 3]
l0_local_window: 128

# Attention-derived edge state.
use_edge_embedding: false
learn_edge_from_attention: false

# Runtime trace bias from recent attention weights.
lateral_edge_trace_enable: false
lateral_edge_trace_mode: true_lateral   # windowed_approx | true_scatter | true_lateral

# Token U-Net — a causal token mixer applied ONCE, outside the refinement-cycle loop.
# block:  cnn   = local causal conv (CausalResBlock1d; uses token_unet_kernel_size)
#         hyena = global FFT long conv (HyenaResBlock1d; O(T log T), one shot, kernel ignored)
# mode:   stem            = mix at token level, L0 stays dense  (MODE 2: cheap global conditioning,
#                           pinball runs at full token resolution). Use token_unet_scale: 1.
#         coarse_tokenize = encode dense -> coarse L0, decode back (MODE 1: global-aware pooling,
#                           fewer L0 nodes -> cheaper cycles).   Use token_unet_scale: >1 (pow2).
token_unet_enable: false
token_unet_block: cnn          # cnn | hyena
token_unet_mode: coarse_tokenize # stem (mode 2) | coarse_tokenize (mode 1)
token_unet_dim: 1d               # auto | 1d | 2d  (text is 1d)
token_unet_scale: 8              # power-of-two. 1 for stem; e.g. 4 for coarse_tokenize pooling
token_unet_kernel_size: 9        # local conv width (cnn block only; ignored by hyena)
token_unet_dropout: 0.1
# Dynamic U-Net: a PROPER causal U-Net (vs the constant-width default). Channels GROW at
# coarser scales (hidden_dim + channel_growth*level, capped at max_channels or 2*hidden_dim)
# and skips are CONCATENATED + fused by a conv (classic U-Net), not added. Capacity is invested
# where multi-token structure lives; recommended over the constant-width path (which underfits).
# Causal (AR-safe) for cnn AND hyena at fixed length; NOTE hyena's positional filter is length-
# normalized so it is NOT stable under incremental generation (fine for teacher-forced training).
token_unet_dynamic: true
token_unet_channel_growth: 256   # +channels per downsample level
token_unet_max_channels: 0       # 0 => 2*hidden_dim
token_unet_concat_skips: true    # true = concat+fuse (classic); false = additive
# Hyena length-invariance: absolute-position filter (vs length-normalized) so past outputs are
# STABLE as the sequence grows -> generation/KV-cache safe. Recommended if using hyena blocks.
token_unet_hyena_length_invariant: true
# Lookahead decode (coarse_tokenize only): a non-causal refinement branch for the right edge.
token_unet_lookahead_decode_enable: false
# --- MODE 1 (global-aware pooling) instead: set the three lines above to ---
# token_unet_mode: coarse_tokenize
# token_unet_scale: 4
# --- Plain CNN baseline instead: set ---
# token_unet_block: cnn

# Cycle the (cheap) coarse levels for extra depth at the bottleneck.
# Stage-2 consolidation: the gate monitor showed top_refiner and upper_cross INERT across two
# runs (scales stuck ~0.01-0.02); upper_refiner was borderline (L3 self-refine 0.04, L2 ~0.002)
# and is deactivated FOR NOW, not removed — re-enable by raising its steps. steps: 0 skips
# building the module entirely. Only the downward cross-query pairs below still run here.
pinball_multirate_enable: false
pinball_multirate_schedule: midpoint   # "midpoint" fires once after midpoint_layer; "after_full_stack" = after ALL layers
# Placement of the multirate/thinking episode: "auto" = mid-stack (layer 6 of 12).
# Prelude -> loop -> coda shape: 9 leaves 3 coda layers to locally mix + decode what the
# episode wrote into L0/L1 (thinking against a MATURE hierarchy, but not so late that the
# head reads unintegrated gated residuals). Old runs trained with auto (=6).
pinball_multirate_midpoint_layer: 9

# --- Energy-gated adaptive multirate cycling ---------------------------------------------
# Instead of a fixed number of multirate passes, iterate the block until each node's own
# relative update (||dx||/||x||, the "energy") falls below tau, up to max_cycles. Halting is
# PER NODE (a settled node freezes at its value; a global halt would leak future settle
# times into past rows through the cycle count). The loop breaks early once ALL rows are
# frozen — provably a no-op, so it's causal AND saves compute on easy batches. Nodes that
# converge fast stop burning updates; unsettled ones keep cycling. Watch
# _last_pinball_multirate_stats: adaptive_cycles / adaptive_energy / adaptive_frozen_frac.
pinball_multirate_adaptive: false   # default off = existing fixed-repeats behavior
pinball_multirate_energy_tau: 0.05  # relative-update threshold; lower = more cycles
pinball_multirate_max_cycles: 1     # hard cap on settling iterations per invocation
pinball_multirate_active_rows: true # cycles 2+ only compute unfrozen query rows in the
                                    # cross-query pairs (exact, verified). Eval fwd ~wash
                                    # (launch-bound) but TRAIN step +4.9% and -1.17 GiB
                                    # peak @8k (frozen rows leave the autograd graph)
pinball_upper_refine_steps: 0     # was 8; deactivated for now (the borderline one)
pinball_top_refine_steps: 0        # was 16; dead in both monitored runs
pinball_upper_cross_attn_steps: 0  # was 4; dead in both monitored runs
pinball_upper_refine_shared_weights: true   # weight-tied = recurrence, tiny param cost
pinball_top_refine_shared_weights: true
pinball_upper_refine_causal: true
pinball_top_refine_causal: true
pinball_upper_refine_window: 128    # 0 = full attention within the (short) level
pinball_top_refine_window: 128
pinball_l3_workspace_tokens: 8    # optional: small learned global register on L3

# --- Cross-level query refiners (PinballPackedCrossAttentionRefiner) --------------------
# Extra cross-attention "thinking" in the upper hierarchy: a query level attends into a
# lower memory level, refined for N shared-weight steps, then written back with a small
# gated residual (write_scale inits ~0, so this is an identity-safe add to a warm start).
# Runs inside the multirate block on the pinball_upper_refine_every cadence, AFTER the L2/L3
# level refiner and BEFORE the top refiner. All at pinball_work_dim / pinball_work_num_heads.
# NOTE: with causal: true + ar_time these run on SDPA (flash is refused when a mask is needed).
#
# (1) Upper cross refiner — hardcoded L3 queries <- L2 memory.
pinball_upper_cross_attn_steps: 0          # master switch; N cross-attn+FFN passes (0 = off; dead in both runs)
pinball_upper_query_topk_l2: 0             # top-k L2 memory per query; 0 = all L2 (few nodes, fine)
pinball_upper_cross_attn_backend: auto     # auto | flash | sdpa (auto -> sdpa when causal-masked)
pinball_upper_cross_attn_causal: true      # mask L2 with ar_time > query ar_time
pinball_upper_cross_attn_shared_weights: true   # weight-tie across steps (recurrence)
pinball_upper_update_l2_enable: false      # also write gated updates back into L2 (bidirectional)
pinball_upper_update_l2_scale_init: 0.01
pinball_upper_cross_write_scale_init: 0.01 # L3 residual write scale (starts ~identity)
#
# (2) Generic cross-query pairs — arbitrary "query:memory" level pairs, one refiner each.
# Each pair is "query:memory": the QUERY level is refined by reading the MEMORY level, and the
# gated residual is written into the QUERY (memory stays read-only unless update_memory_enable).
# DOWNWARD DISTRIBUTION (below): the lower levels QUERY L3, so L3's abstraction reaches L2/L1/L0
# in ONE hop (fast, vs the bridges' multi-hop L3->L2->L1->L0). Because L3 is read-only memory, its
# forward features are NOT pulled toward token specifics (no abstraction drift) — gradient only
# shapes L3 to be a readable summary, which the aux loss reinforces. Causal: each L0/L1/L2 query
# reads only L3 nodes whose window ends at/before it (leak-free). memory=L3 is few nodes -> cheap.
# "2:3" dropped: its write scale self-selected to zero (0.1 -> 0.048 and falling by ep10) —
# L2 is ADJACENT to L3, so the bridges edges already deliver L3->L2 in one hop; the explicit
# cross-query only pays off where the bridge path is multi-hop (L1, L0).
pinball_cross_query_pairs: ["1:3", "0:3"]  # L1<-L3, L0<-L3 (downward broadcast)
pinball_cross_query_steps: 2               # master switch; passes per pair (0 = off)
# 0 = attend ALL memory (no top-k selection). Memory here is L3 (few nodes) so this is cheap AND
# avoids the global_mean selection's causality subtlety (its shared top-k is picked from a query
# averaged over ALL positions incl. future). With 0 only the per-position causal mask applies.
pinball_cross_query_topk: 0                # top-k memory nodes per selection; 0 = all
pinball_cross_query_l0_window: 0           # only used when a pair's memory level is 0 (±ar_time window)
# Recency cap on the episode read (ar-time units): each query reads only memory that closed
# within the last W token-times — per-query, inside the causal mask, so leak-free and
# BIT-IDENTICAL to unlimited while context <= W. 32768 = last 1024 closed L3 windows: inert
# for training runs at 8k, engages beyond 32k so the per-query read set is bounded (linear
# scaling; content retrieval past the window is xq_nominate's job, and adding hierarchy
# levels above L3 extends global reach at geometrically shrinking node counts).
pinball_cross_query_memory_window: 32768
pinball_cross_query_backend: auto
pinball_cross_query_causal: true
pinball_cross_query_shared_weights: true
pinball_cross_query_update_memory_enable: false  # keep L3 read-only in the forward (no abstraction drift)
pinball_cross_query_selection: global_mean # global_mean (shared top-k) | per_query (per-query top-k, heavier)
# Residual write scale into the query level. Last run this COLLAPSED 0.01 -> 1e-4 (model gated the
# upward "3:1" read off). Start higher to force the downward path open; if it re-collapses, the
# fix is a hard floor in the refiner (currently soft, can still learn down).
pinball_cross_query_write_scale_init: 0.1

# Hierarchy auxiliary (reconstruction) loss. ON: trains L1/L2/L3 to reconstruct (detached) L0
# features -> shapes L3 into a good L0-abstraction, which is exactly what the downward cross-query
# (L0/L1/L2 <- L3) needs to be worth reading. Synergises with the copredict head.
use_aux_loss: true

# PREDICTIVE coarse aux (Stage 3, "next-concept" prediction) — the LM objective one timescale up.
# Each coarse node at window i predicts the DETACHED pooled child summary of window i+h at its own
# level, where h (auto) is the first strictly-future NON-overlapping window (h=2 at 50% overlap) —
# so copying the current window scores NOTHING; only forecasting does. Complements (does not
# replace) the reconstruction aux above: reconstruction rewards summarizing the past, this rewards
# abstraction that carries forward. Training-only (forward untouched, no leak surface); targets
# detached (JEPA-style). OFF here so the current upref_consolidated run is unaffected — flip on
# for the next run (safe mid-warm-start too: it only adds small per-level predictor MLPs).
hier_predaux_enable: true  # cleaner-pinball: ON — with the scatter gradient path gone, the
                           # coarse levels carry their own predictive objective (Stage 3)
lambda_hier_predaux: 0.05
hier_predaux_levels: [1, 2, 3]
hier_predaux_horizon: 0        # windows ahead; 0 = auto (first non-overlapping window)
hier_predaux_loss_mode: mse # cosine | mse_norm | mse
hier_predaux_predictor: mlp    # mlp | linear
# AR runs: next (forecast only — a "prev" head would be trivially copyable and empty). MASKED
# runs: both (future is partially visible so "next" alone degrades toward copying; predicting
# both non-overlapping neighbours = masked-window summary prediction, the bidirectional analogue).
hier_predaux_directions: both  # next | both
# By default the aux loss uses each level's features as a STOP-GRAD (detached) target (JEPA
# anti-collapse): the coarse levels are trained to predict L0, but no aux gradient flows back
# into L0. With coarse_tokenize, L0 IS the Hyena-pooled output — so this directly links the aux
# objective to the Hyena pooling, letting the aux gradient shape the pooled representation
# toward being reconstructable from the hierarchy. L1/L2/L3 stay detached to limit collapse
# risk. Off by default (experimental).
hier_aux_link_l0_target: false

# Coarse co-prediction into L0 (deep supervision at the head). Each configured coarse level
# (L1/L2/L3) projects its most-recent STRICTLY-PAST closed node (window_end <= token time —
# the same node the staggered edges pick, so leak-free) into L0's pre-head features, scaled by
# a learnable per-level gate. This gives the coarse compute a DIRECT next-token gradient and a
# read-back path at the head, bypassing the late-ascent problem (L3 otherwise only fills at
# layer ~11 and is never read). Reuses the tied vocab head (cheap). Improves inference too, not
# just the loss. gate init 0.0 = warm-start bit-identical to a checkpoint without it.
hier_copredict_l0: false  # cleaner-pinball: OFF — the per-layer downward refresh IS this same
                          # gather, applied in-stack at every layer instead of only at the head
hier_copredict_levels: [1, 2, 3]   # coarse levels that co-predict L0 (clipped to available levels)
hier_copredict_gate_init: 0.0      # per-level gate init; 0.0 = identity warm start, e.g. 0.1 for fresh runs

# ============================================================================
# IMAGE MODALITY (MaskGIT, bidirectional) + SPATIAL CURVE MODE
# ============================================================================
# Curve mode: L0 tokens are reordered by a generalized-Hilbert curve after the
# stem (inverse at output), so the 1D window hierarchy pools spatially compact
# blocks (quadtree-like at comp [16,4,4]) while geometry stays "sequence" and
# the full pack/refresh recipe runs. spatial_dims is auto-set from the VQ grid
# by the cli for discrete runs.
modality: image
spatial_curve: hilbert #none #hilbert
spatial_dims: [32, 32]
# Axial ND RoPE on the packed path: attention scores use TRUE (dy,dx) offsets
# (L0 = pixel coords, coarse = child-blob centroid) instead of 1D curve-index
# rotations — proper 2D positioning inside the curve blobs. A/B knob.
local_pack_rope_axial: true
# Two-sided packed windows under the bidi runtime flags (see pack memory).
local_pack_bidirectional: true
# Downward refresh reads the CONTAINING parent (spatial ancestor in curve mode)
# instead of "most recent closed" — the bidi-correct variant. Leaks under AR.
hier_downward_bidi_parent: true
# NOTE: rope_mode must NOT be "1d" (axial coords need the ND dispatch); the
# default "auto" is correct. xq_nominate stays OFF (causal machinery).

image_dataset_root: /media/david/SSD_Data/Datasets/tiny-imagenet  # /media/david/SSD_Data/Datasets/tiny-imagenet # /media/david/SSD_Data/Datasets/imagenet1k_hf  # ImageFolder layout: train/ + val/ class dirs
image_size: 64 #64 #256
image_num_classes: 200 # 1000
image_objective: maskgit
image_roundtrip_check: true
image_num_workers: 4
image_cache_mode: readwrite                 # off | read | write | readwrite (latent/token shard cache)
# Auto-prepare: build the ImageFolder from a HF dataset if the root is missing/empty.
image_auto_prepare: true
image_hf_dataset_id: zh-plus/tiny-imagenet #zh-plus/tiny-imagenet #ILSVRC/imagenet-1k
image_prepare_streaming: true
image_prepare_max_train: 0            # 0 = all samples
image_prepare_max_val: 0
image_prepare_overwrite: false

# --- discrete variant: VQ codebook tokens, masked cross-entropy (closest analog
# to the text NLL head-to-heads). vocab/grid/mask id come from the VQ tokenizer.
image_maskgit_variant: discrete
image_maskgit_vq_model_name: "./llamavae/vq_ds8_c2i.pt"   #"./llamavae/vq_ds16_c2i.pt"    # REQUIRED: hf id or local path of the VQGAN (e.g. llamagen vq16)
image_maskgit_train_mask_min: 0.1  # near-zero-mask batches carry ~no gradient
image_maskgit_train_mask_max: 1.0
image_maskgit_val_mask_ratio: 0.5
image_maskgit_steps: 12
image_maskgit_schedule: cosine
image_maskgit_confidence: stability
image_maskgit_use_timestep_cond: true

# EMA shadow weights: updated every optimizer step (decay ramps 0.95 -> 0.995); the
# MaskGIT sampling/preview paths prefer the EMA model. Saved as pinball_<tag>_ema.pt
# next to each checkpoint and auto-restored on --resume.
use_ema: true
# Classifier-free guidance training: drop the class label with this probability so the
# unconditional branch is trained (needed for preview/FID guidance_scale > 1).
image_class_cond_drop_prob: 0.1

# Per-epoch sample-grid previews (fake|real pairs under <checkpoint_dir>/preview_examples).
image_preview_enable: true
image_preview_eval_interval: 1        # every N epochs (0 = off)
image_preview_num_samples: 8
image_preview_guidance_scale: 1.0
# FID against the val set (needs torchmetrics[image]); expensive — off by default.
image_fid_enable: false
image_fid_eval_interval: 0            # every N epochs (0 = off)
image_fid_num_samples: 2048
image_fid_guidance_scale: 3.0
