#
#   arm              post-norm  refreshes  refresh pre-norms  collapses  |mu|/sigma  spec@ep15
#   legacy              ON         ON            no              2         40.32      0.46333
#   betternormstack     off        ON            yes             0          0.83      0.42833
#   post-norm only      ON         off           n/a             0          1.00      (0.42527@10)
#   THIS ARM            ON         ON           YES              ?            ?          ?
#
# The single unstable cell is the only one where the refresh projections had no pre-norm of
# their own (they read the shared stream norm, which normalises everything incl. L0, rather
# than the pooled rows the projection actually consumes). And legacy is not a specificity-
