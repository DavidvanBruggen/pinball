# Pinball hierarchical graph transformer — autoregressive LM on WikiText-103.
# Friendly toggles (attn_backend / qkv_sharing / train_mode / use_hqd) expand to the
# underlying flags in pinball.config.PinballConfig. See README for the full toggle table.

model_type: pinball
modality: text
tokenizer_name: gpt2

# Data — point this at your text file (WikiText-103 combined, FineWeb, etc.).
text_file: /home/david/Projects/hgt_geomet/proj-oc/hierarchical-graph-transformer/wikitext_103_raw/wikitext_combined.txt #./data/pg19_train.txt
block_size: 1024 #16384 #32768 #1024
batch_size: 32
val_split: 0.01

# Training
train_mode: ar            # ar | masked_diffusion
learning_rate: 0.0001
weight_decay: 0.1
warmup_steps: 1000
#max_steps: 20000
# Optimizer: adamw | muon_hybrid. muon_hybrid trains 2D+ weight matrices with Muon at
# learning_rate * muon_lr_mult (RMS-matched to AdamW), and 1D params (embeddings, norms,
# biases) with AdamW at the base LR — usually learns markedly faster than plain AdamW.
optimizer: muon_hybrid
muon_lr_mult: 6.0                 # Muon LR multiplier on the matrix param group
muon_betas: [0.9, 0.95]          # AdamW betas for the 1D param group
muon_adjust_lr_fn: match_rms_adamw
# Epochs: an epoch is `samples_per_epoch` samples; validation + a generation follow each.
# Set num_epochs to drive the run by epochs (it then sets the step budget); otherwise the
# epoch count is derived from max_steps. (CLI: --epochs / --samples-per-epoch.)
num_epochs: 100
samples_per_epoch: 25000 #782 #25000
gradient_accumulation_steps: 1   # accumulate grads over N batches before an optimizer step
gradient_checkpointing: false    # trade compute for memory in the refinement stack
# Long-context diagnostic: every N validations, log next-token PPL bucketed by in-context
# recurrence distance (never / <128 / 128-511 / 512-2k / >2k). Cheap — reuses the val batches,
# no extra forward. The split that matters: <128 (inside local window) vs >=128 (needs the
# hierarchy). 0 = off. longctx_diag_max_seqs caps sequences scanned per run (default 64).
longctx_diag_every: 1
# longctx_diag_max_seqs: 64
# Periodic generation / checkpointing (in training batches; 0 = per-epoch / end only).
# (CLI: --generate-every / --save-every / --checkpoint-dir.)
generate_every: 0
# Generation prompt/continuation lengths. gen_prompt_tokens defaults to min(64, block_size//2);
# raise it for long-range PG19 conditioning (must be <= block_size). Leave sample_prompt unset
# so the prompt is sampled from held-out val text rather than a fixed short string.
gen_prompt_tokens: 512
gen_max_new_tokens: 512
save_every: 0
checkpoint_dir: ./pinball/sepqkv_gpt2/checkpoints
#log_every:             # emit the Step/EFF/Cache log lines every N steps (CLI: --log-every)
# Resume: restores weights + optimizer + LR schedule + step/epoch counters and continues.
# resume_from: ./checkpoints/pinball_final.pt   # (CLI: --resume)

# AR graph connectivity — make the hierarchy graph causal for autoregressive training.
# ar_graph_causal sets hier_ar_enable + l0_ar_enable together; the individual dials below
# (any of them) can be set directly for fine-grained control.
ar_graph_causal: true
# hier_ar_enable: true            # level-wise edges are time-forward only
# l0_ar_enable: true              # L0 intra-level edges are causal (time-forward only)
# hier_ar_allow_same_time: true   # allow src_time == dst_time edges
# enable_l0_parent_edges: false   # add L0->parent edges across levels
# l0_parent_edges_bidirectional: false
# ensure_l0_past_l1_edges: false  # guarantee each L0 node sees past L1 nodes
# ensure_past_hier_edges_all_levels: false
# long_range_distance: 3      # max graph hops for long-range edges

# Core shape
hidden_dim: 768 #768
num_heads: 12 #12
# Fat-QKV (sparse paths only): decouple the Q/K and V head dims from hidden_dim/num_heads
# on the SPARSE-SCATTER attention. Flash local-window attention is unaffected (it requires
# qk==v head_dim). Both default 1.0 = off (bit-identical).
#   attn_sparse_v_mult : widen v_head_dim — a richer value payload carried THROUGH the sparse
#     aggregation (the capacity a dense model can't afford), down-projected on output. Applies
#     to BOTH sparse paths: the cross-level (vertical) message passing AND the HQD read.
#   attn_sparse_qk_mult: widen qk_head_dim. Your head_dim is 64 < model_dim 128, so the per-head
#     routing form is rank-capped at 64; mult 2.0 -> head_dim 128 = full rank. Helps up to ==128.
#     Applies to the cross-level message passing; the HQD descent SELECTION stays at head_dim
#     (its q/k entangle with the shared zipper-qk cache + witness scoring — widening there is a
#     separate follow-up). HQD still gets the fat-V payload above.
# (To add more independent routing patterns instead, raise num_heads above — uncapped, compounding.)
attn_sparse_qk_mult: 1.0    # try 2.0 to lift cross-level routing rank 64 -> 128
attn_sparse_v_mult: 1.0     # try 2.0 / 4.0 for fat-V (both sparse paths)
num_refinement_layers: 12 #12
num_layers: [0, 0, 0, 0]
internal_cycles: [0, 0, 0, 0]
refinement_style: unified
unified_refinement_cycles: 1
l0_cycles: 0
iterative_refinement_cycles: 0
local_connectivity_window_size: 0
compression_ratios: [16, 4, 4]
overlap_ratios: [0.5, 0.5, 0.5]
norm_type: layernorm
dropout: 0.1

# Attention / hierarchy toggles
attn_backend: flash        # pyg | flash | sdpa
qkv_sharing: separate      # shared | separate
# Tier-3 packed cross-level backbone attention: a dense/batched fast lane for the
# cross-level message passing (groups each destination's parents into a padded fixed-K
# block per level, runs [B,Q,K,H,D] attention instead of gather/segment-softmax/scatter).
# Mathematically identical to the scatter default (validated 2.1e-6); scatter stays the
# default + the fallback for every graph feature it can't pack (edge feats/conditioning,
# learned edges, trace, witnesses, fat-QKV). ~1.2-1.3x on uniform cross-level degree;
# pays off on large/dense graphs, negligible at this config's sparse cross-level edges.
cross_level_packed: false
# Per-level cross-level (backbone + HQD) QKV. With qkv_sharing:separate the WINDOWS already
# have per-level QKV; this gives the VERTICAL (cross-level) path the same, so an L0 query
# attends to an L3 key in a level-specific subspace (vs today's single shared projection +
# additive level-pair bias). Feeds packed/scatter cross-level AND the HQD selector; the local
# window path keeps its own QKV. Copy-initialized from shared (starts bit-identical, fp32
# parity 0.0). ~1-3% slower (same FLOPs, each node projected once by its level). Modes:
#   shared        : single q/k/v_proj for all levels (default, current behaviour)
#   per_level_qk  : per-level Q and K, shared V  (~+57M params; routing lives in q.k)
#   per_level_qkv : per-level Q, K and V         (~+85M params; max expressiveness)
#   reuse_local   : reuse the per-level LOCAL window projections (no new params)
cross_level_qkv: shared
use_hqd: False              # enables packed witness runtime hook
hqd_query_chunk_size: 1024000000 # 4096
hqd_include_local_window: False
hqd_every_n: 3                 # packed witness read every refinement layer
hqd_reuse_previous: False
hqd_reuse_max_age: 0
hqd_topk_l3: 4 #8 #4 #16 #16 # 4
hqd_topk_l2: 4 #8 #4 #16 #8 #32 # 4
hqd_topk_l1: 4 #16 #4 #128 #32 #64 # 16
hqd_topk_l0: 8 #64 #64 #256 #64 #128 # 128
hqd_l0_topk_enable: True
hqd_query_level: 0       # query at L0 (token level); query_level>=1 breaks AR causality
hqd_stop_level: 0
hqd_handoff_to_l0: false
hqd_global_topk: 0 #65536
hqd_use_existing_zipper_projections: true   # reuse the zipper q/k projections
# HQD final-read attention implementation. Same edge set + same causality either way.
#   scatter : per-edge gather + segment-softmax + scatter_add (PyG). Default, robust.
#   dense   : group each destination's edges into a block + fused attention. Only wins
#             when the HQD apply is a bottleneck AND degrees are ~uniform (bounded K).
#             PROFILED: with witnesses + bag + read_levels the apply is only ~3-6ms of a
#             ~164ms step and degrees are ragged (L0 ~28 vs coarse ~128), so dense gives
#             ~no speedup. dense/sdpa pads to max degree => wasteful on ragged sets (auto
#             falls back to scatter past hqd_dense_max_pad_ratio); dense/flash (ragged)
#             ties scatter. Keep scatter unless you have a bounded uniform edge set.
hqd_attn_impl: scatter        # scatter | dense; inert when hqd_packed_witness_read=true succeeds
hqd_dense_backend: flash       # sdpa | flash (flash-varlen if installed, else sdpa)
# Recompute the existing parent->L0 witness table, but consume selected rows as packed
# fixed-K reads inside message passing. This avoids materializing a flattened L0 witness
# edge list while preserving the old summary/rare witness selection behavior.
hqd_select_inside_message_passing: false
hqd_graph_witness_enable: false
hqd_graph_witness_topk: 4
hqd_packed_witness_read: true
hqd_packed_witness_source: recompute # recompute | graph
hqd_packed_witness_chunk_size: 2048
# Descent shortcut ("bag instead of descend"). 0 = full scored descent (L3,L2,L1,L0).
#   2 = score L3,L2 then take ALL L1 children of the selected L2 nodes unscored (skip the
#       L1 scoring stage); the final L0 stage still scores + prunes to topk_l0. Saves one
#       scoring pass. BEHAVIOUR-CHANGING (alters selection) — validate quality with a run.
hqd_descent_stop_at: 0       # 0 | 2
# Shallow bag read ("L0 queries L3, bags down"): stop the SCORED descent at this level and
# reach L0 only through the selected coarse nodes' precomputed bags, skipping the L2/L1/L0
# scoring stages (the ~18ms cost). 0 = off. 3 = score L3 only. 2 = score L3,L2. REQUIRES the
# stop level in witness_levels (the bag is the only path to L0) and use_witness_packets: true.
# Causal for AR (bag = causal key + src<=dst). Behaviour-changing — validate quality.
hqd_shallow_read_level: 3     # 0 | 2 | 3
# Bidirectional coarse routing (option 2): coarse nodes attend among themselves (few nodes =
# cheap) and matched pairs surface bag<->bag L0 edges — long-range mixing without every token
# descending. NOT AR-causal (coarse-as-query leaks); auto-disabled under AR with a warning.
# Use only for masked-diffusion / bidirectional (e.g. masked image, DNA). [] = off. Requires the
# routed levels in witness_levels.
hqd_coarse_route_levels: []   # e.g. [3] or [2,3]
hqd_coarse_route_topk: 8      # neighbours each coarse node routes to
# Original HQD edge-read settings are kept inert by hqd_packed_witness_read=true:
# the runtime selector returns only packed L0 witness ids and never materializes the
# old flattened HQD L0/coarse edge list. Keep these minimal as a safety/default.
hqd_read_levels: [0]

# Recomputed witness packets are the selection source for packed reads; they are not
# materialized as old sparse HQD edges when hqd_packed_witness_read=true succeeds.
use_witness_packets: true        # build parent->L0 witness table
use_summary_witnesses: true      # top-k children by graph responsibility (q_parent . k_child)
use_rare_witnesses: true         # top-k by responsibility + lambda * detached surprise
summary_witness_per_head: false  # true = top-k per attention head (diversity, ~num_heads x slots)
witness_k_summary: 4             # summary witnesses per parent (per head if per_head)
witness_k_rare: 4               # rare/surprise witnesses per parent
witness_max_per_parent: 0      # cap on total witness slots/parent (0 = uncapped). Bounds the
                                # candidate width so per_head*num_heads can't blow up cost: the
                                # build is ~0.6% of a step, the inflated candidate set is what scales.
witness_levels: [3]             # packed shallow L3 read looks up selected L3 rows only.
                                # [1,2,3] also builds cross-level L2->L0 / L3->L0 bags so a coarse
                                # selection reaches its important L0 descendants without descending.
                                # Causal-verified for AR; enables the shallow-read / coarse-route paths.
witness_lambda_rare: 0.3        # weight on normalized aux-reconstruction surprise
witness_score_bias: 5.0         # logit bonus that force-includes witnesses past final top-k

# Per-level window bag: scatter the L0 routing's per-level selections back UP so coarse nodes
# (L1/L2/L3) also gain lateral reach. [] = off. Requires use_hqd: true.
#   per_position : each coarse node's bag = its own descendants' selections. STRICTLY CAUSAL.
#   global       : one shared top-k bag/level. NOT AR-causal (bidi / masked-diffusion only).
hqd_window_bag_levels: []       # old HQD edge-bag path disabled; packed witnesses carry long reads
hqd_window_bag_routing: per_position # per_position (causal) | global (non-causal, bidi only)
# per_position: 0 = natural bound (every descendant selection, ~descendants x topk_lX per node);
#               >0 = hard fixed budget (top-N descendant selections per coarse node by score).
# global: the shared bag size per level (0 -> 16).
hqd_window_bag_topk: 0

local_attn_levels: [0, 1, 2, 3]
local_attn_windows: [128, 128, 128, 128]
local_attn_causal_levels: [0, 1, 2, 3]
l0_local_window: 128

# Attention-derived edge state.
use_edge_embedding: false
learn_edge_from_attention: false

# Runtime trace bias from recent attention weights.
lateral_edge_trace_enable: false
lateral_edge_trace_mode: true_lateral   # windowed_approx | true_scatter | true_lateral

# Hierarchy auxiliary (reconstruction) loss
use_aux_loss: True
