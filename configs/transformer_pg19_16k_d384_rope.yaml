# GPT-style transformer baseline (same data/tokenizer as the Pinball configs).

model_type: transformer
modality: text
tokenizer_name: gpt2

# Data — point this at your text file (WikiText-103 combined, FineWeb, etc.).
text_file: ./data/pg19_train.txt   # + ./data/pg19_train.pt (token cache) alongside
block_size: 16384
batch_size: 4                      # GH200: 95 GB usable; transformer OOMs at 8 (full logits). SAME for all arms
val_split: 0.01

num_epochs: 200                       # ~3.3B tokens ~ one PG19 pass
samples_per_epoch: 1000              # 16.4M tokens/epoch
gradient_accumulation_steps: 1  # accumulate grads over N batches before an optimizer step
gradient_checkpointing: false    # trade compute for memory in the refinement stack
# Chunked CE loss head: the model emits token FEATURES and the loss projects + cross-entropies
# in seq-chunks of `chunked_ce_seq_chunk`, never materializing the full [B,T,vocab] logits (+ its
# softmax/CE backward). 
train_feature_chunked_ce_enable: true
chunked_ce_seq_chunk: 64
# Long-context diagnostic: every N validations, log next-token PPL bucketed by in-context
# recurrence distance (never / <128 / 128-511 / 512-2k / >2k). Cheap — reuses the val batches,
# no extra forward. The split that matters: <128 (inside local window) vs >=128 (needs the
# hierarchy). 0 = off. longctx_diag_max_seqs caps sequences scanned per run (default 64).
longctx_diag_every: 1
longctx_diag_long_edges: [8192]   # adds 2k-8k and >8k buckets
# longctx_diag_max_seqs: 64
# Generation prompt/continuation lengths. gen_prompt_tokens defaults to min(64, block_size//2);
# raise it for long-range PG19 conditioning (must be <= block_size). Leave sample_prompt unset
# so the prompt is sampled from held-out val text rather than a fixed short string.
gen_prompt_tokens: 1024
gen_max_new_tokens: 512
save_every: 0
checkpoint_dir: ./transformer/pg19_16k_transformer_rope/checkpoints

train_mode: ar
learning_rate: 1e-4 #0.0001
weight_decay: 0.1
#max_steps: 20000
warmup_steps: 1000
optimizer: muon_hybrid    # adamw | muon_hybrid (Muon on matrices, AdamW on 1D params)
muon_lr_mult: 6.0

# Transformer shape
hidden_dim: 384 #768 (parent)
num_heads: 6 #12 (parent); head_dim stays 64
transformer_n_layer: 12
transformer_ffn_type: swiglu
transformer_use_rope: true
transformer_use_abs_pos_emb: false   # RoPE ONLY: no learned absolute position table (see header)
transformer_attn_backend: auto   # auto | flash | sdpa
# Compile each block's forward in training (parity with pinball's hier_layer_compile so the
# speed comparison stays fair; +33-37% measured on image shapes). Training-only, eager
# fallback on failure. Numerics shift slightly under fusion — don't flip mid-comparison.
transformer_compile: true
dropout: 0.1

# ---- d384 set (see header) ----
muon_batched: true             # same update, Newton-Schulz batched per shape
